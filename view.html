<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E5240">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">
  <title>Your Property Report · Harmony Horticulture</title>
  <link rel="icon" type="image/png" href="assets/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="assets/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="assets/favicon-light.png" id="favicon">
  <script>
    // Brown favicon for dark browsers, light one otherwise. Also covers
    // browsers that ignore the media setting on the links above.
    (function () {
      var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
      var set = function () { document.getElementById("favicon").href = mq && mq.matches ? "assets/favicon-dark.png" : "assets/favicon-light.png"; };
      set();
      if (mq && mq.addEventListener) mq.addEventListener("change", set);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261118d">
  <link rel="stylesheet" href="css/report.css?v=20261118d">
  <style>
    body { background: var(--panel); }
    .vbar { background: #fff; color: var(--text); border-bottom: 3px solid var(--leaf); padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
    .vbar-in { max-width: 816px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .vbar img { height: 42px; }
    .vbar .btn-row button, .vbar .btn-row a { font: inherit; font-weight: 600; font-size: 0.88rem; border-radius: 8px; padding: 9px 14px; text-decoration: none; }
    .vbar a.dl { background: var(--green); color: #fff; }
    .vbar button.pr { background: #fff; color: var(--green); border: 1px solid var(--green); }
    .vwrap { padding: 20px 16px 40px; }
    .vmsg { max-width: 560px; margin: 60px auto; background: #fff; border-radius: 12px; padding: 28px; text-align: center; }
    @media (max-width: 700px) { .vwrap { padding: 0 0 30px; } }
  </style>
</head>
<body>
  <div class="vbar no-print">
    <div class="vbar-in">
      <img src="assets/mark.png" alt="Harmony Horticulture">
      <div class="btn-row" id="vActions"></div>
    </div>
  </div>
  <div class="vwrap"><div id="vBody"><p class="muted" style="text-align:center;margin-top:40px">Loading your report…</p></div></div>

  <script src="vendor/supabase.min.js?v=20261118d"></script>
  <script src="vendor/jspdf.umd.min.js?v=20261118d"></script>
  <script src="js/config.js?v=20261118d"></script>
  <script src="js/store.js?v=20261118d"></script>
  <script src="js/render.js?v=20261118d"></script>
  <script src="js/exports.js?v=20261118d"></script>
  <script src="js/view.js?v=20261118d"></script>
</body>
</html>
