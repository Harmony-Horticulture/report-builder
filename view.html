<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5F351B">
  <meta name="robots" content="noindex, nofollow">
  <title>Your Property Report · Harmony Horticulture</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/report.css">
  <style>
    body { background: var(--panel); }
    .vbar { background: var(--brown); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
    .vbar-in { max-width: 816px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .vbar img { height: 42px; }
    .vbar .btn-row button, .vbar .btn-row a { font: inherit; font-weight: 600; font-size: 0.88rem; border-radius: 8px; padding: 9px 14px; text-decoration: none; }
    .vbar a.dl { background: var(--green); color: #fff; }
    .vbar button.pr { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.6); }
    .vwrap { padding: 20px 16px 40px; }
    .vmsg { max-width: 560px; margin: 60px auto; background: #fff; border-radius: 12px; padding: 28px; text-align: center; }
    @media (max-width: 700px) { .vwrap { padding: 0 0 30px; } }
  </style>
</head>
<body>
  <div class="vbar no-print">
    <div class="vbar-in">
      <img src="assets/mark-reversed.png" alt="Harmony Horticulture">
      <div class="btn-row" id="vActions"></div>
    </div>
  </div>
  <div class="vwrap"><div id="vBody"><p class="muted" style="text-align:center;margin-top:40px">Loading your report…</p></div></div>

  <script src="vendor/supabase.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/exports.js"></script>
  <script src="js/view.js"></script>
</body>
</html>
